name: Docker Image CI

# Tag-driven release, mirroring the .dev tag schema of the flamapy packages.
#   v1.2.3       -> docker :latest + :v1.2.3
#   v1.2.3.dev0  -> docker :dev    + :v1.2.3.dev0  (preview only)
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.*

env:
  IMAGE: flamapy/flamapy-rest

jobs:

  # Build each architecture on its own native runner (no QEMU emulation, so the
  # python-sat C extension compiles at native speed) and push it by digest.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_API_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch images into a single multi-arch tag (flamapy-rest:<tag>).
  merge:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_API_TOKEN }}

      # .dev tags move the floating ":dev" tag; real releases move ":latest".
      - name: Compute moving tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME}" == *dev* ]]; then
            echo "moving=dev" >> "$GITHUB_OUTPUT"
          else
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${MOVING}" \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          MOVING: ${{ steps.meta.outputs.moving }}

      - name: Inspect the published image
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
