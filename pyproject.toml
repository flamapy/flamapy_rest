[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flamapy-rest"
version = "2.6.0"
description = "Flamapy feature model is a distribution of the flama framework containing all plugins required to analyze feature models. It also offers a richer API and a complete command line interface and documentation."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Flamapy", email = "flamapy@us.es" }]
requires-python = ">=3.11"
dependencies = [
    "Flask",
    "gunicorn",
    "flamapy~=2.6.0",
    "flask-swagger-ui",
    "flask-restplus",
    "flask_cors",
    "flasgger",
    "Flask-Limiter",
    "cachetools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "mypy",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/flamapy/flamapy-rest"

[tool.setuptools.packages.find]
include = ["flamapy.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "C", "PL", "RUF"]
ignore = [
    "RUF012",
    "RUF002",
    "RUF001",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]
"build/*" = ["ALL"]
"resources/*" = ["ALL"]
".mypy_cache/*" = ["ALL"]
"venv/*" = ["ALL"]
".venv/*" = ["ALL"]
"env/*" = ["ALL"]
"__pycache__/*" = ["ALL"]

[tool.mypy]
explicit_package_bases = true
scripts_are_modules = true
show_traceback = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_no_return = true
strict_optional = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
warn_unreachable = true
